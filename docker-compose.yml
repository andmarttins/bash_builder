name: builder-solutions

services:
  # PostgreSQL and Redis are deliberately external Dokploy services. The bootstrap
  # job receives the administrator URL; no application container does.
  db-bootstrap:
    image: postgres:18.1-alpine
    restart: "no"
    environment:
      BOOTSTRAP_DATABASE_URL: ${BOOTSTRAP_DATABASE_URL:?BOOTSTRAP_DATABASE_URL is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      APP_MIGRATOR_DB_PASSWORD: ${APP_MIGRATOR_DB_PASSWORD:?APP_MIGRATOR_DB_PASSWORD is required}
      APP_RUNTIME_DB_PASSWORD: ${APP_RUNTIME_DB_PASSWORD:?APP_RUNTIME_DB_PASSWORD is required}
      APP_WORKER_DB_PASSWORD: ${APP_WORKER_DB_PASSWORD:?APP_WORKER_DB_PASSWORD is required}
    volumes:
      - ./infra/postgres/01-create-runtime-role.sh:/init.sh:ro
    command: ["sh", "/init.sh"]
    networks: [dokploy-network]

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.1
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls localhost:9644 --exit-when-healthy"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [platform-internal]

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.migrate
    restart: "no"
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:?MIGRATOR_DATABASE_URL is required}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    networks: [dokploy-network]

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?BOOTSTRAP_TOKEN is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      # Optional private S3-compatible storage (MinIO). Leave all five values empty to disable uploads.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [platform-internal, dokploy-network]

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL is required}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-builder-worker}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-builder-worker-v1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/builder-worker-ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [platform-internal, dokploy-network]

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [platform-internal]

volumes:
  redpanda_data:

networks:
  # Shared only by components that need the independent Dokploy data services.
  dokploy-network:
    external: true
  # Keeps API-to-web, worker-to-Kafka and Kafka traffic out of the global network.
  platform-internal:
    internal: true
