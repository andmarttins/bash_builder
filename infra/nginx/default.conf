server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Docker Compose can replace the API container without replacing this web
  # container. Resolve the service name at request time so Nginx does not keep
  # a stale container IP after an API rollout.
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location /api/ {
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
