server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Docker Compose can replace the API container without replacing this web
  # container. Resolve the service name at request time so Nginx does not keep
  # a stale container IP after an API rollout.
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # Metrics are scraped directly from the private Compose network. Do not let
  # the public /api proxy become an alternate path, even with a bearer token.
  location = /api/metrics {
    return 404;
  }

  location /api/ {
    set $api_upstream api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The API may set its own policy for a public token response. Keep exactly
    # one definitive policy at the edge so the bearer URL never becomes a referrer.
    proxy_hide_header Referrer-Policy;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
